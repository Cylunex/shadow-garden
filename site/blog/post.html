<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · Shadow Garden</title>
<link rel="stylesheet" href="/assets/main.css">
<script>(function(){var t=localStorage.getItem("garden-theme");if(t)document.documentElement.setAttribute("data-theme",t)})();</script>
<script src="/assets/js/garden.js" defer></script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">Shadow Garden</a>
    <nav class="nav-links">
      <a href="/projects/">项目</a>
      <a href="/blog/">博客</a>
      <a href="/moments/">说说</a>
      <a href="/food/">美食</a>
      <a href="/travel/">旅行</a>
      <a href="/about/">关于</a>
      <button class="theme-btn" id="theme-btn" title="切换主题">🌗</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <a class="crumb" href="/blog/">← 返回博客</a>
  <article class="article" id="article">
    <p class="state-note">加载中…</p>
  </article>
</main>

<footer>
  <div class="wrap">© 2026 Cylunex · Shadow Garden · <a href="/feed.xml">RSS</a> · <a href="/stats/">花园数据</a> · <a href="/api/random">随便逛逛</a></div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const G = window.Garden;
  const box = document.getElementById("article");
  const slug = new URLSearchParams(location.search).get("slug");
  if (!slug) { G.stateNote(box, "缺少文章标识。", true); return; }
  try {
    const p = await G.api("/api/posts/" + encodeURIComponent(slug));
    document.title = p.title + " · Shadow Garden";
    const meta = [
      G.fmtDate(p.published_at || p.created_at),
      p.word_count + " 字",
      "约 " + p.reading_minutes + " 分钟",
      p.views + " 次阅读",
    ].join(" · ");
    const nav =
      (p.prev || p.next)
        ? '<nav class="post-nav">' +
          (p.prev
            ? '<a href="/blog/post.html?slug=' + encodeURIComponent(p.prev.slug) + '">← ' + G.esc(p.prev.title) + "</a>"
            : "<span></span>") +
          (p.next
            ? '<a href="/blog/post.html?slug=' + encodeURIComponent(p.next.slug) + '">' + G.esc(p.next.title) + " →</a>"
            : "<span></span>") +
          "</nav>"
        : "";
    box.innerHTML =
      "<h1>" + G.esc(p.title) + "</h1>" +
      '<div class="meta">' + meta + "</div>" +
      G.tagsHtml(p.tags) +
      '<div class="prose" id="prose">' + p.content_html + "</div>" +
      '<div class="water-row">' +
      '<button class="water-btn" id="water-btn">🌱 给这篇浇水 · <span id="water-count">' + p.waters + "</span></button>" +
      '<div class="water-note">觉得不错就浇一瓢水，让它长得更好</div>' +
      "</div>" +
      nav;

    // 浇水：本地记住已浇，服务端（Redis）再兜一层每天一次
    const waterBtn = document.getElementById("water-btn");
    const waterKey = "garden-watered:" + slug;
    if (localStorage.getItem(waterKey)) waterBtn.classList.add("watered");
    waterBtn.addEventListener("click", async () => {
      if (waterBtn.classList.contains("watered")) return;
      try {
        const res = await G.api("/api/posts/" + encodeURIComponent(slug) + "/water", { method: "POST" });
        document.getElementById("water-count").textContent = res.waters;
        waterBtn.classList.add("watered");
        localStorage.setItem(waterKey, "1");
      } catch (err) {
        /* 网络失败就算了，不打扰阅读 */
      }
    });

    // 有两个以上小标题时生成目录
    const heads = box.querySelectorAll("#prose h2, #prose h3");
    if (heads.length >= 2) {
      let toc = '<nav class="toc"><b>目录</b><ul>';
      heads.forEach((h, i) => {
        h.id = "sec-" + i;
        toc += '<li class="toc-' + h.tagName.toLowerCase() + '"><a href="#sec-' + i + '">' +
          G.esc(h.textContent) + "</a></li>";
      });
      toc += "</ul></nav>";
      document.getElementById("prose").insertAdjacentHTML("beforebegin", toc);
    }
  } catch (e) {
    G.stateNote(box, e.status === 404 ? "文章不存在或已下架。" : "加载失败：" + e.message, true);
  }
});
</script>

</body>
</html>
