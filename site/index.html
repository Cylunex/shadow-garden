<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shadow Garden — Cylunex 的数字花园：博客、项目、美食与旅行">
<title>Shadow Garden · Cylunex 的数字花园</title>
<link rel="alternate" type="application/rss+xml" title="Shadow Garden" href="/feed.xml">
<link rel="stylesheet" href="/assets/main.css">
<script>(function(){var t=localStorage.getItem("garden-theme");if(t)document.documentElement.setAttribute("data-theme",t)})();</script>
<script src="/assets/js/garden.js" defer></script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">Shadow Garden</a>
    <nav class="nav-links">
      <a href="/projects/">项目</a>
      <a href="/blog/">博客</a>
      <a href="/moments/">说说</a>
      <a href="/food/">美食</a>
      <a href="/travel/">旅行</a>
      <a href="/about/">关于</a>
      <button class="theme-btn" id="theme-btn" title="切换主题">🌗</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="hero">
    <div class="hi">Cylunex 的数字花园</div>
    <h1>种一些代码，<br>也种一些<em>生活</em>。</h1>
    <p>这里是我的花园：写下的博客、做出来的项目、吃过的好味道、走过的远方，各自生长，不定期浇水。</p>
    <div class="actions">
      <a class="btn btn-primary" href="/projects/">逛逛项目</a>
      <a class="btn btn-ghost" href="/blog/">读读博客</a>
    </div>
  </div>

  <section id="projects">
    <div class="sec-head"><h2>项目</h2><span>做过和正在做的东西</span><a class="more" href="/projects/">全部 →</a></div>
    <div class="grid" id="projects-box"><p class="state-note">加载中…</p></div>
  </section>

  <section id="blog">
    <div class="sec-head"><h2>博客</h2><span>不定期更新</span><a class="more" href="/blog/">全部 →</a></div>
    <ul class="post-list" id="posts-box"><li class="state-note">加载中…</li></ul>
  </section>

  <section id="moments">
    <div class="sec-head"><h2>说说</h2><span>随手记下的碎碎念</span><a class="more" href="/moments/">全部 →</a></div>
    <div id="moments-box"><p class="state-note">加载中…</p></div>
  </section>

  <section id="food">
    <div class="sec-head"><h2>美食</h2><span>吃过的好味道</span><a class="more" href="/food/">全部 →</a></div>
    <div class="grid" id="food-box"><p class="state-note">加载中…</p></div>
  </section>

  <section id="travel">
    <div class="sec-head"><h2>旅行</h2><span>走过的远方</span><a class="more" href="/travel/">全部 →</a></div>
    <ul class="post-list" id="trips-box"><li class="state-note">加载中…</li></ul>
  </section>

</main>

<footer>
  <div class="wrap">
    © 2026 Cylunex · Shadow Garden · <a href="/feed.xml">RSS</a> · <a href="/admin/">后台</a>
    <br>
    <!-- 备案号下来后替换成：<a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">X ICP备XXXXXXXX号</a> -->
    <span>ICP 备案审核中</span>
  </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const G = window.Garden;
  const boxes = {
    projects: document.getElementById("projects-box"),
    posts: document.getElementById("posts-box"),
    moments: document.getElementById("moments-box"),
    food: document.getElementById("food-box"),
    trips: document.getElementById("trips-box"),
  };
  try {
    const data = await G.api("/api/summary");
    boxes.projects.innerHTML = data.projects.length
      ? data.projects.map(G.projectCard).join("")
      : '<p class="state-note">还没有项目，去后台种一个。</p>';
    boxes.posts.innerHTML = data.posts.length
      ? data.posts.map(G.postItem).join("")
      : '<li class="state-note">还没有文章。</li>';
    boxes.moments.innerHTML = data.moments.length
      ? data.moments.map((m) => G.momentCard(m, true)).join("")
      : '<p class="state-note">还没有说说。</p>';
    boxes.food.innerHTML = data.food.length
      ? data.food.map(G.foodCard).join("")
      : '<p class="state-note">还没有美食记录。</p>';
    boxes.trips.innerHTML = data.trips.length
      ? data.trips.map(G.tripItem).join("")
      : '<li class="state-note">还没有游记。</li>';
  } catch (e) {
    Object.values(boxes).forEach((el) => G.stateNote(el, "内容加载失败：" + e.message, true));
  }
});
</script>

</body>
</html>
