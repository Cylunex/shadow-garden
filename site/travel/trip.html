<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游记 · Shadow Garden</title>
<link rel="stylesheet" href="/assets/main.css">
<link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css">
<script>(function(){var t=localStorage.getItem("garden-theme");if(t)document.documentElement.setAttribute("data-theme",t)})();</script>
<script src="/assets/js/garden.js" defer></script>
<script src="/assets/vendor/leaflet/leaflet.js" defer></script>
<script src="/assets/js/map.js" defer></script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">Shadow Garden</a>
    <nav class="nav-links">
      <a href="/projects/">项目</a>
      <a href="/blog/">博客</a>
      <a href="/moments/">说说</a>
      <a href="/food/">美食</a>
      <a href="/travel/">旅行</a>
      <a href="/about/">关于</a>
      <button class="theme-btn" id="theme-btn" title="切换主题">🌗</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <a class="crumb" href="/travel/">← 返回旅行</a>
  <article class="article" id="article">
    <p class="state-note">加载中…</p>
  </article>
</main>

<footer>
  <div class="wrap">© 2026 Cylunex · Shadow Garden · <a href="/feed.xml">RSS</a></div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const G = window.Garden;
  const box = document.getElementById("article");
  const id = new URLSearchParams(location.search).get("id");
  if (!id) { G.stateNote(box, "缺少游记标识。", true); return; }
  try {
    const t = await G.api("/api/trips/" + encodeURIComponent(id));
    document.title = t.title + " · Shadow Garden";
    const meta = [t.destination, G.tripDates(t)].filter(Boolean).map(G.esc).join(" · ");
    const photos = t.photos.length
      ? '<div class="photo-grid">' + t.photos.map((u) =>
          '<img src="' + G.esc(u) + '" alt="" loading="lazy">').join("") + "</div>"
      : "";
    const hasGeo = t.lat != null && t.lng != null;
    box.innerHTML =
      "<h1>" + G.esc(t.title) + "</h1>" +
      (meta ? '<div class="meta">' + meta + "</div>" : "") +
      (t.summary ? '<p class="state-note" style="padding:.5rem 0">' + G.esc(t.summary) + "</p>" : "") +
      (hasGeo ? '<div class="map-box small" id="trip-map"></div>' : "") +
      photos +
      '<div class="prose">' + t.content_html + "</div>";
    if (hasGeo) {
      const map = GardenMap.create(document.getElementById("trip-map"));
      GardenMap.markers(map, [{ lat: t.lat, lng: t.lng, html: G.esc(t.destination || t.title) }]);
    }
  } catch (e) {
    G.stateNote(box, e.status === 404 ? "游记不存在。" : "加载失败：" + e.message, true);
  }
});
</script>

</body>
</html>
