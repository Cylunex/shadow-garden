<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行 · Shadow Garden</title>
<link rel="stylesheet" href="/assets/main.css">
<script>(function(){var t=localStorage.getItem("garden-theme");if(t)document.documentElement.setAttribute("data-theme",t)})();</script>
<script src="/assets/js/garden.js" defer></script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">Shadow Garden</a>
    <nav class="nav-links">
      <a href="/projects/">项目</a>
      <a href="/blog/">博客</a>
      <a href="/moments/">说说</a>
      <a href="/food/">美食</a>
      <a href="/travel/">旅行</a>
      <a href="/about/">关于</a>
      <button class="theme-btn" id="theme-btn" title="切换主题">🌗</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>旅行</h1>
    <p>走过的远方，按时间倒序生长。</p>
  </div>
  <ul class="post-list" id="list" style="margin-top:1.5rem"><li class="state-note">加载中…</li></ul>
</main>

<footer>
  <div class="wrap">© 2026 Cylunex · Shadow Garden · <a href="/feed.xml">RSS</a> · <a href="/stats/">花园数据</a> · <a href="/api/random">随便逛逛</a><br><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备2026044449号</a></div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const G = window.Garden;
  const list = document.getElementById("list");
  try {
    const items = (await G.api("/api/trips")).items;
    list.innerHTML = items.length
      ? items.map(G.tripItem).join("")
      : '<li class="state-note">还没有游记，下一段旅程见。</li>';
  } catch (e) {
    G.stateNote(list, "加载失败：" + e.message, true);
  }
});
</script>

</body>
</html>
