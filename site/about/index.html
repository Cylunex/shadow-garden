<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 · Shadow Garden</title>
<link rel="stylesheet" href="/assets/main.css">
<script>(function(){var t=localStorage.getItem("garden-theme");if(t)document.documentElement.setAttribute("data-theme",t)})();</script>
<script src="/assets/js/garden.js" defer></script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="/">Shadow Garden</a>
    <nav class="nav-links">
      <a href="/projects/">项目</a>
      <a href="/blog/">博客</a>
      <a href="/moments/">日常</a>
      <a href="/food/">美食</a>
      <a href="/travel/">旅行</a>
      <a href="/about/">关于</a>
      <button class="theme-btn" id="theme-btn" title="切换主题">🌗</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>关于</h1>
  </div>
  <div class="about" style="margin-top:1.8rem">
    <div class="text" id="about-box"><p class="state-note">加载中…</p></div>
  </div>
</main>

<footer>
  <div class="wrap">© 2026 Cylunex · Shadow Garden · <a href="/feed.xml">RSS</a> · <a href="/stats/">花园数据</a> · <a href="/api/random">随便逛逛</a><br><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备2026044449号</a></div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const G = window.Garden;
  const box = document.getElementById("about-box");
  try {
    const data = await G.api("/api/about");
    const links = data.links.length
      ? '<p class="links" style="margin-top:1rem">' + data.links.map((l) =>
          '<a href="' + G.esc(l.url) + '" target="_blank" rel="noopener">' + G.esc(l.label) + "</a>").join("") + "</p>"
      : "";
    box.innerHTML = '<div class="prose">' + data.content_html + "</div>" + links;
  } catch (e) {
    G.stateNote(box, "加载失败：" + e.message, true);
  }
});
</script>

</body>
</html>
